apiVersion: v1
kind: Pod
metadata:
  name: client-pod
  annotations:
    k8s.v1.cni.cncf.io/networks: '[
      {
        "name": "macvlan-conf",
        "ips": ["192.168.100.102/24"]
      },
      {
        "name": "macvlan-conf2",
        "ips": ["192.168.200.102/24"]
      }
    ]'
spec:
  restartPolicy: Never
  containers:
    - name: client
      image: mirek321/cba-usrsctp-client:latest
      command: ["./client"]
  automountServiceAccountToken: false
