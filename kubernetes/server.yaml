apiVersion: v1
kind: Pod
metadata:
  name: server-pod
  annotations:
    k8s.v1.cni.cncf.io/networks: '[
      {
        "name": "macvlan-conf",
        "ips": ["192.168.100.101/24"]
      },
      {
        "name": "macvlan-conf",
        "ips": ["192.168.200.101/24"]

      }
    ]'
spec:
  containers:
    - name: server
      image: mirek321/cba-usrsctp-server:latest
      command: ["./server"]
  automountServiceAccountToken: false
