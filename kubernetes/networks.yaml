---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-conf
spec:
  config: '{
    "cniVersion": "0.3.1",
    "plugins": [
      {
        "type": "macvlan",
        "capabilities": { "ips": true },
        "master": "enp0s3",
        "mode": "bridge",
        "ipam": {
          "type": "static"
        }
      },
      {
        "capabilities": { "mac": true },
        "type": "tuning"
      }
    ]
  }'

---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-conf2
spec:
  config: '{
    "cniVersion": "0.3.1",
    "plugins": [
      {
        "type": "macvlan",
        "capabilities": { "ips": true },
        "master": "enp0s8",
        "mode": "bridge",
        "ipam": {
          "type": "static"
        }
      },
      {
        "capabilities": { "mac": true },
        "type": "tuning"
      }
    ]
  }'
---
apiVersion: v1
kind: Pod
metadata:
  name: server-pod
  annotations:
    k8s.v1.cni.cncf.io/networks: '[
      {
        "name": "macvlan-conf",
        "ips": ["192.168.100.101/24"]
      },
      {
        "name": "macvlan-conf2",
        "ips": ["192.168.200.101/24"]
      }
    ]'
spec:
  containers:
    - name: server
      image: mirek321/cba-usrsctp-server:latest
      command: ["./discard_server"]
      ports:
        - name: sctp
          containerPort: 9
          protocol: SCTP
  automountServiceAccountToken: false

---
apiVersion: v1
kind: Pod
metadata:
  name: client-pod
  annotations:
    k8s.v1.cni.cncf.io/networks: '[
      {
        "name": "macvlan-conf",
        "ips": ["192.168.100.102/24"]
      },
      {
        "name": "macvlan-conf2",
        "ips": ["192.168.200.102/24"]
      }
    ]'
spec:
  restartPolicy: Never
  containers:
    - name: client
      image: mirek321/cba-usrsctp-client:latest
      command: ["./client", "192.168.100.101", "9"]
      ports:
        - name: sctp
          containerPort: 9
          protocol: SCTP
  automountServiceAccountToken: false
