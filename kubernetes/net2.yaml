apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-conf2
spec:
  config: '{
    "cniVersion": "0.3.1",
    "plugins": [
      {
        "type": "macvlan",
        "capabilities": { "ips": true },
        "master": "enp0s8",
        "mode": "bridge",
        "ipam": {
          "type": "static"
        }
      },
      {
        "capabilities": { "mac": true },
        "type": "tuning"
      }
    ]
  }'
